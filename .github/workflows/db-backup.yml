name: Weekly DB Backup

# Off-site backup net for the production Postgres (Neon), independent of the
# provider's own retention. Dumps the whole database weekly and keeps the
# compressed dump as a downloadable artifact.
#
# Setup (one-time): add a repository secret named DATABASE_URL containing the
# Neon connection string (postgres://...:...@...neon.tech/dbname?sslmode=require).
# Run manually anytime via the "Run workflow" button (workflow_dispatch).

on:
  schedule:
    - cron: '0 2 * * 0'   # every Sunday 02:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set."
            exit 1
          fi
          STAMP=$(date -u +%Y%m%d-%H%M)
          pg_dump --no-owner --no-privileges "$DATABASE_URL" | gzip > "fps-db-${STAMP}.sql.gz"
          ls -lh fps-db-*.sql.gz

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: fps-db-backup
          path: fps-db-*.sql.gz
          retention-days: 90
